baseURL = "https://madneal.com"
#baseURL = "https://cdn.jsdelivr.net/gh/neal1991/neal1991.github.io"
languageCode = "zh-cn"
title = "Neal's Blog"
theme = "hugo-nuo"
enableRobotsTXT = true
PygmentsCodeFences = true
canonifyurls = true
rssLimit = 20
timeZone = "Asia/Shanghai"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Google Analytics UA number
# Universal Analytics retired; set GA4 measurement ID when available
# googleAnalytics = "G-XXXXXXXX"
googleAnalytics = ""

# Copyright of your post
copyright = "© This post is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License，please give source if you wish to quote or reproduce."

[services]
  [services.disqus]
    shortname = "nealecnu"

# Initial site menu, you can extend menu with content.
[[menu.main]]
  name = "Home"
  weight = 10
  identifier = "home"
  url = "/post"

[[menu.main]]
  name = "Works"
  weight = 20
  identifier = "works"
  url = "https://github.com/madneal"

[[menu.main]]
  name = "Tags"
  weight = 30
  identifier = "tags"
  url = "/tags/"

[[menu.main]]
  name = "About"
  weight = 40
  identifier = "about"
  url = "/about/"

[[menu.main]]
  name = "Privacy"
  weight = 50
  identifier = "privacy"
  url = "/privacy/"


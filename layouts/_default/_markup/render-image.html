{{- $src := .Destination -}}
{{- if hasPrefix $src "../../static/" -}}
  {{- $src = strings.TrimPrefix "../../static/" $src | relURL -}}
{{- end -}}
{{- $priority := eq .Ordinal 0 -}}
<img src="{{ $src | safeURL }}"
  alt="{{ .Text }}"
  {{- with .Title }} title="{{ . }}"{{ end }}
  decoding="async"
  {{- if $priority }} fetchpriority="high"{{ else }} loading="lazy" fetchpriority="low"{{ end }}>
